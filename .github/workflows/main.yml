name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # lets you trigger manually from the Actions tab

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate platform folders
        # The repo only contains lib/, pubspec.yaml, AndroidManifest.xml and assets.
        # `flutter create .` fills in android/, ios/, and the gradle wrapper.
        run: flutter create . --org com.you.neckalert --project-name neck_alert --platforms=android

      - name: Restore custom AndroidManifest.xml
        # `flutter create` overwrites our manifest; restore it from git.
        run: git checkout -- android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned)
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neck-alert-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: neck-alert-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
