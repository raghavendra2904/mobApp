name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # lets you trigger manually from the Actions tab

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate platform folders
        # The repo only contains lib/, pubspec.yaml, AndroidManifest.xml and assets.
        # `flutter create .` fills in android/, ios/, and the gradle wrapper.
        run: flutter create . --org com.you.neckalert --project-name neck_alert --platforms=android

      - name: Restore custom AndroidManifest.xml
        # `flutter create` overwrites our manifest; restore it from git.
        run: git checkout -- android/app/src/main/AndroidManifest.xml

      - name: Force a modern Kotlin Gradle plugin version
        # Some plugin dependencies (e.g. shared_preferences_android) are compiled
        # with Kotlin 1.9+. If `flutter create` emits an older template that pins
        # Kotlin 1.7.x, the build fails with "Module was compiled with an
        # incompatible version of Kotlin". Patch both possible locations.
        run: |
          set -e
          # Newer template: android/settings.gradle uses the plugins { } DSL.
          if [ -f android/settings.gradle ]; then
            sed -i -E 's|id "org\.jetbrains\.kotlin\.android" version "[0-9.]+"|id "org.jetbrains.kotlin.android" version "1.9.22"|g' android/settings.gradle
            echo "--- android/settings.gradle ---"
            cat android/settings.gradle
          fi
          # Older template: top-level android/build.gradle has ext.kotlin_version.
          if [ -f android/build.gradle ]; then
            sed -i -E "s|ext\.kotlin_version = ['\"][0-9.]+['\"]|ext.kotlin_version = '1.9.22'|g" android/build.gradle
            echo "--- android/build.gradle ---"
            cat android/build.gradle
          fi

      - name: Pin targetSdk = 33 in both Groovy and Kotlin DSL build files
        # Flutter 3.27 uses Kotlin DSL (build.gradle.kts) by default. Without
        # patching that file, targetSdk stays at the Flutter default (35),
        # which triggers Android 14+ MissingForegroundServiceTypeException in
        # flutter_background_service v6.x. We must edit whichever file exists.
        run: |
          set -e
          echo "Files in android/app/:"
          ls -la android/app/
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              # Lower minSdk for the plugin requirements.
              sed -i -E 's|minSdk(Version)? *= *flutter\.minSdkVersion|minSdk = 21|g' "$f" || true
              sed -i -E 's|minSdkVersion +flutter\.minSdkVersion|minSdkVersion 21|g' "$f" || true
              # Pin targetSdk to 33 across every syntax variant we've seen.
              sed -i -E 's|targetSdk(Version)? *= *flutter\.targetSdkVersion|targetSdk = 33|g' "$f" || true
              sed -i -E 's|targetSdkVersion +flutter\.targetSdkVersion|targetSdkVersion 33|g' "$f" || true
              sed -i -E 's|targetSdk(Version)? *= *[0-9]+|targetSdk = 33|g' "$f" || true
              sed -i -E 's|targetSdk(Version)? +[0-9]+|targetSdk 33|g' "$f" || true
              echo "--- $f (after patch) ---"
              cat "$f"
              echo "--- end $f ---"
            fi
          done
          # Sanity check: fail loudly if targetSdk is still 34/35 anywhere.
          if grep -rE 'targetSdk[A-Za-z]*[ =]+(34|35)' android/app/; then
            echo "ERROR: targetSdk patch did not stick" >&2
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned)
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neck-alert-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: neck-alert-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
