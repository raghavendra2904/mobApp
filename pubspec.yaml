name: neck_alert
description: Alerts you when your phone is held near-horizontal for too long — a proxy for neck-bending posture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Sensors
  sensors_plus: ^4.0.2

  # Background work (Android foreground service / iOS background fetch best-effort)
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  flutter_background_service_ios: ^5.0.3

  # Floating overlay (Android only)
  flutter_overlay_window: ^0.4.5

  # Alerts
  vibration: ^1.8.4
  audioplayers: ^5.2.1

  # Persistence
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # Charts
  fl_chart: ^0.66.2

  # Permissions
  permission_handler: ^11.3.0

  # Screen state (pause monitoring when screen off)
  flutter_screen_lock: ^9.0.3

dev_dependencies:
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
