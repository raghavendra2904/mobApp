name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # lets you trigger manually from the Actions tab

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate platform folders
        # The repo only contains lib/, pubspec.yaml, AndroidManifest.xml and assets.
        # `flutter create .` fills in android/, ios/, and the gradle wrapper.
        run: flutter create . --org com.you.neckalert --project-name neck_alert --platforms=android

      - name: Restore custom AndroidManifest.xml
        # `flutter create` overwrites our manifest; restore it from git.
        run: git checkout -- android/app/src/main/AndroidManifest.xml

      - name: Force a modern Kotlin Gradle plugin version
        # Some plugin dependencies (e.g. shared_preferences_android) are compiled
        # with Kotlin 1.9+. If `flutter create` emits an older template that pins
        # Kotlin 1.7.x, the build fails with "Module was compiled with an
        # incompatible version of Kotlin". Patch both possible locations.
        run: |
          set -e
          # Newer template: android/settings.gradle uses the plugins { } DSL.
          if [ -f android/settings.gradle ]; then
            sed -i -E 's|id "org\.jetbrains\.kotlin\.android" version "[0-9.]+"|id "org.jetbrains.kotlin.android" version "1.9.22"|g' android/settings.gradle
            echo "--- android/settings.gradle ---"
            cat android/settings.gradle
          fi
          # Older template: top-level android/build.gradle has ext.kotlin_version.
          if [ -f android/build.gradle ]; then
            sed -i -E "s|ext\.kotlin_version = ['\"][0-9.]+['\"]|ext.kotlin_version = '1.9.22'|g" android/build.gradle
            echo "--- android/build.gradle ---"
            cat android/build.gradle
          fi

      - name: Bump Android compileSdk / minSdk for plugins that need it
        # flutter_background_service & flutter_overlay_window often need a
        # compileSdk >= 34 and minSdk >= 21. The default template usually has
        # these, but patch defensively in case the runner template lags.
        run: |
          set -e
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's|minSdk(Version)? = flutter\.minSdkVersion|minSdk = 21|g' android/app/build.gradle || true
            sed -i -E 's|minSdkVersion flutter\.minSdkVersion|minSdkVersion 21|g' android/app/build.gradle || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned)
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neck-alert-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: neck-alert-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
